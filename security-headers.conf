# BUG-13: única fuente de verdad para los headers de seguridad de toda la
# app (SPA, assets y /api/* proxeado). Se incluye explícitamente en cada
# `location` que ya define su propio `add_header` (Cache-Control) porque
# nginx solo hereda los `add_header` del nivel padre si el hijo no define
# ninguno propio — no hay forma de "heredar además de agregar".
#
# Vive en /etc/nginx/templates/ (no copiado directo) para que el entrypoint
# oficial de nginx lo procese con envsubst — únicamente ${CSP_CONNECT_SRC_EXTRA}
# varía por entorno (ver docker-entrypoint.sh): vacío en stg/prod (R2 es
# https, ya cubierto por "https:" abajo), y el origen público de MinIO en
# docker-compose local (http://localhost:9000 — HTTP y puerto distinto al
# del propio frontend, así que ni 'self' ni "https:" lo cubren).
#
# BUG-13 (hallazgo post-cierre, 2026-08-26): la misma variable se reutiliza
# en frame-src. file-preview-modal.component.ts previsualiza documentos en un
# <iframe [src]> apuntando directo a la URL prefirmada (R2 en prod, MinIO en
# local) — sin frame-src explícito, CSP cae a default-src 'self' y bloquea el
# framing por completo (la descarga en pestaña nueva sí funcionaba porque esa
# no es una carga enmarcada). "https:" ya cubre R2 (endpoint fijo por cuenta,
# siempre https); ${CSP_CONNECT_SRC_EXTRA} cubre MinIO local por el mismo
# motivo que en connect-src.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# BUG-13: nginx.conf.template nunca tuvo este header — solo lo ponía helmet
# (backend), y solo en /api/*, nunca en / (la SPA). Al apagar `hsts: false`
# en helmet (nginx pasa a ser la única fuente) hacía falta agregarlo acá
# también, o se perdía de toda la app en vez de solo dejar de duplicarse.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Ajustar CSP si se agregan CDNs/analytics:
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https:${CSP_CONNECT_SRC_EXTRA}; frame-src 'self' https:${CSP_CONNECT_SRC_EXTRA}; frame-ancestors 'none'" always;
