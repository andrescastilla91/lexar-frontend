name: CI — Frontend

# Validación de calidad en cada push y PR.
# El DEPLOY NO ocurre aquí: lo hace la integración nativa Railway ↔ GitHub
# (webhook al hacer push a main, con "Wait for CI" activado en Railway
# para que solo despliegue si este workflow queda en verde).

on:
  push:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build de verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Jest) — F1
        run: npm test -- --ci --coverage

      - name: Design system — sin colores crudos ni emojis (U1)
        run: |
          if grep -rnE "bg-\[#|bg-blue-|bg-indigo-" src/app --include='*.ts' --include='*.html'; then
            echo "::error::Encontradas clases de color fuera del design system. Usa los tokens de docs/02-design-system/tokens.css."
            exit 1
          fi
          if grep -rnP "[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]" src/app --include='*.ts' --include='*.html' | grep -v "console\."; then
            echo "::error::Encontrados emojis en templates (UI). Usa SVG (Heroicons) en su lugar. Los emojis en console.log no cuentan."
            exit 1
          fi

      # BUG-20 ola 4: guardia contra el patrón error.error?.message (se salta
      # las reglas por status de error.interceptor.ts, BUG-19) y contra
      # alert() nativo (debe usarse ToastService, ver docs/06-bugs/BUG-20-*).
      # Dos excepciones documentadas:
      # - legal-processes.service.ts: territorio de BUG-10, fuera de BUG-20.
      # - líneas marcadas con "// bug20-401-ok": endpoints de login/2FA
      #   (auth, platform-admin, portal-auth) donde el fallo esperado es 401
      #   y error.interceptor.ts ignora ese status a propósito (ver el
      #   comentario dentro de auth.service.ts login()).
      - name: BUG-20 — sin error.error?.message ni alert() nativo
        run: |
          PATTERN_HITS=$(grep -rnE '\.error\?\.message' src/app --include='*.ts' \
            | grep -v '/legal-processes.service.ts' \
            | grep -v 'bug20-401-ok' \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$PATTERN_HITS" ]; then
            echo "::error::Encontrado error.error?.message fuera de legal-processes.service.ts. Usa error.message (ver error.interceptor.ts, BUG-19/BUG-20)."
            echo "$PATTERN_HITS"
            exit 1
          fi

          ALERT_HITS=$(grep -rnE '\balert\(' src/app --include='*.ts' \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$ALERT_HITS" ]; then
            echo "::error::Encontrado alert() nativo. Usa ToastService (ver BUG-20)."
            echo "$ALERT_HITS"
            exit 1
          fi

      - name: Build producción
        run: npx ng build --configuration production

      # HU-SEC-3: gate real de auditoría de dependencias (no existía en este
      # repo). Falla si hay high/critical en dependencias de producción sin
      # excepción vigente en security/audit-exceptions.json.
      - name: Auditoría de dependencias (producción)
        run: node scripts/audit-gate.js
